[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avmdbg"
version = "1.0.0"
description = "A lightweight, agent-friendly debugger for the Android runtime (JDWP over adb)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["android", "debugger", "jdwp", "dalvik", "art", "reverse-engineering"]
authors = [{ name = "avmdbg contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/cheetahsec/avmdbg"
Repository = "https://github.com/cheetahsec/avmdbg"
Issues = "https://github.com/cheetahsec/avmdbg/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
avmdbg = "avmdbg.cli:main"
